<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<title>AI Hub</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--mute:#526077;--line:#dfe6f0;--accent:#2563eb;--accent-ink:#fff;--bad:#b42318;--ok:#16815d;--warn:#b45309;--chip:#eef2f9}
@media (prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#171e2d;--ink:#e6ebf5;--mute:#98a4ba;--line:#283247;--accent:#6b9bff;--accent-ink:#0b1020;--bad:#ff8a7a;--ok:#5ad0a0;--warn:#f0b35a;--chip:#212b3f}}
*{box-sizing:border-box}
html{font:16px/1.5 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
body{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button,select,input,textarea{min-height:44px}
button{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{max-width:1100px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:12px;padding:12px 0 6px;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:-.02em}
.tinker-return{display:inline-flex;align-items:center;text-decoration:none;color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;white-space:nowrap;font-weight:600}
.agents{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;min-height:26px;color:var(--mute);border:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--person,#9aa5b8);flex:none}
.dot.on{background:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;color:var(--mute);font-weight:600}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
#err{color:var(--bad);font-size:13px;min-height:0;margin:0;padding:6px 0}
#err:empty{display:none}
.view{display:none;flex:1;min-height:0;flex-direction:column;padding-top:12px}
.view.active{display:flex}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
#feed{flex:1;min-height:80px;overflow-y:auto;overscroll-behavior:contain;padding:16px;border-radius:14px 14px 0 0}
.msg{border-left:3px solid var(--person);background:var(--chip);border-radius:4px 12px 12px 4px;padding:10px 14px;margin:0 0 12px;max-width:94%;overflow-wrap:anywhere}
.msg.mine{margin-left:auto}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.meta .who{color:var(--person);font-weight:700;font-size:14px}
.meta time{margin-left:auto;font-size:11px}
.badge{border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.badge.task{color:var(--accent)}.badge.handoff{color:var(--warn)}.badge.review{color:var(--ok)}.badge.result{color:var(--ok)}
a.tag,button.tag{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:0 7px;min-height:22px;font-size:11px;color:var(--accent);text-decoration:none}
.body{white-space:pre-wrap;margin:8px 0 0}
.files{margin:8px 0 0;padding:0;list-style:none;font-size:13px}
.empty{text-align:center;color:var(--mute);padding:40px 12px}
#composer{border-top:0;border-radius:0 0 14px 14px;padding:12px;display:grid;gap:8px}
#composer .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea{width:100%;resize:vertical;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);max-width:100%}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:8px 18px;font-weight:700}
.btn.alt{background:var(--chip);color:var(--ink);font-weight:600}
.btn.bad{background:var(--bad);color:var(--accent-ink)}
.btn[disabled]{opacity:.5}
.filter{display:flex;gap:8px;align-items:center;padding:0 0 8px;font-size:13px;color:var(--mute)}
.filter[hidden]{display:none}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-bottom:10px}
.toolbar .grow{flex:1}
#board,#agentlist{overflow-y:auto;flex:1;min-height:0;padding-bottom:16px}
details.col{margin:0 0 10px}
details.col>summary{cursor:pointer;font-weight:700;padding:10px 4px;min-height:44px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.task{text-align:left;padding:12px 14px;display:grid;gap:4px;width:100%}
.task .t{font-weight:700;overflow-wrap:anywhere}
.task .s{font-size:12px;color:var(--mute)}
.st{font-size:11px;font-weight:700;border-radius:6px;padding:1px 8px;background:var(--chip)}
.st.in_progress{color:var(--accent)}.st.in_review{color:var(--warn)}.st.blocked{color:var(--bad)}.st.done{color:var(--ok)}
.agent{padding:12px 14px;margin-bottom:8px;display:grid;gap:6px}
.agent .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.agent .top strong{font-size:16px}
.agent .row{display:flex;gap:8px;flex-wrap:wrap}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:#0008}
.dlg{padding:18px;display:grid;gap:12px;overflow-y:auto;max-height:calc(100dvh - 26px)}
.dlg h2{margin:0;font-size:18px;overflow-wrap:anywhere}
.dlg label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.dlg .two{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.timeline{margin:0;padding:0;list-style:none;font-size:13px;display:grid;gap:6px}
.timeline li{border-left:2px solid var(--line);padding-left:10px}
.token{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all;padding:10px;border-radius:10px;background:var(--chip);user-select:all}
.warn{color:var(--warn);font-size:13px}
.attach{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.attach .chip button{background:none;border:0;min-height:20px;padding:0 2px;color:var(--mute)}
.md{overflow-wrap:anywhere;line-height:1.55}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p,.md ul,.md ol,.md pre,.md blockquote,.md .tablewrap{margin:.5em 0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:.8em 0 .35em;line-height:1.25}
.md h1{font-size:1.3em}.md h2{font-size:1.18em}.md h3{font-size:1.08em}.md h4,.md h5,.md h6{font-size:1em}
.md ul,.md ol{padding-left:1.5em}
.md code{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:0 4px}
.md pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre}
.md pre code{background:none;border:0;padding:0;font-size:.85em}
.md blockquote{border-left:3px solid var(--line);margin-left:0;padding:0 0 0 12px;color:var(--mute)}
.md hr{border:0;border-top:1px solid var(--line);margin:.8em 0}
.md .tablewrap{overflow-x:auto}
.md table{border-collapse:collapse;font-size:.92em}
.md th,.md td{border:1px solid var(--line);padding:4px 10px;text-align:left;vertical-align:top}
.md th{background:var(--card)}
.md a{color:var(--accent)}
.md-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
pre.plain{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--chip);border-radius:10px;padding:10px 12px;margin:0;font-size:13px}
#composer[hidden],.toolbar[hidden]{display:none}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--accent)}
.frow{display:flex;gap:12px;align-items:center;padding:10px 12px;margin-bottom:8px}
.frow .info{flex:1;min-width:0;overflow-wrap:anywhere}
.frow img{width:48px;height:48px;object-fit:cover;border-radius:8px;flex:none}
.thumb{display:block;max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--line);margin-top:6px}
input[type=file]{display:none}
.derr{color:var(--bad);font-size:13px;margin:0}.derr:empty{display:none}
@media (max-width:560px){.dlg .two{grid-template-columns:1fr}.shell{padding-left:10px;padding-right:10px}.tinker-return{padding:8px 10px;font-size:13px}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <a id="tinker-return" class="tinker-return" href="https://ubuntudev.tail8afec3.ts.net/#/dashboard">← Tinker</a>
    <h1>AI Hub</h1>
    <div class="agents" id="agentchips" aria-label="Các AI trong phòng"></div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Khu vực">
    <button role="tab" id="tab-room" aria-selected="true" aria-controls="view-room" data-tab="room">Phòng</button>
    <button role="tab" id="tab-board" aria-selected="false" aria-controls="view-board" data-tab="board">Việc</button>
    <button role="tab" id="tab-ai" aria-selected="false" aria-controls="view-ai" data-tab="ai">AI</button>
    <button role="tab" id="tab-files" aria-selected="false" aria-controls="view-files" data-tab="files">Tệp</button>
  </nav>
  <p id="err" role="status"></p>

  <section class="view active" id="view-room" role="tabpanel" aria-labelledby="tab-room">
    <div class="toolbar" id="roomtools" hidden><button class="btn alt" id="legacybtn" type="button">📜 Hộp thư cũ</button></div>
    <div class="filter" id="filter" hidden></div>
    <div class="card" id="feed" aria-live="polite"></div>
    <form class="card" id="composer" autocomplete="off">
      <textarea id="msg" placeholder="Nhắn vào phòng… (Ctrl+Enter để gửi)" aria-label="Nội dung tin nhắn"></textarea>
      <div class="row">
        <label for="to" class="chip">Gửi tới</label>
        <select id="to" aria-label="Người nhận"></select>
        <span id="attachslot"></span>
        <span style="flex:1"></span>
        <button class="btn" id="send" type="submit">Gửi</button>
      </div>
    </form>
  </section>

  <section class="view" id="view-board" role="tabpanel" aria-labelledby="tab-board">
    <div class="toolbar">
      <button class="btn" id="newtask" type="button">+ Việc mới</button>
      <select id="fassignee" aria-label="Lọc theo người làm"></select>
      <span class="grow"></span>
    </div>
    <div id="board"></div>
  </section>

  <section class="view" id="view-ai" role="tabpanel" aria-labelledby="tab-ai">
    <div class="toolbar">
      <button class="btn" id="newagent" type="button">+ Thêm AI</button>
      <button class="btn alt" id="importlegacy" type="button">📜 Nhập lịch sử hộp thư cũ</button>
      <span class="grow"></span>
    </div>
    <div id="agentlist"></div>
  </section>

  <section class="view" id="view-files" role="tabpanel" aria-labelledby="tab-files">
    <div class="card" style="padding:12px 14px;margin-bottom:10px"><div id="fsummary"></div></div>
    <div class="toolbar">
      <label class="chip" for="purgedays">Dọn tệp cũ hơn</label>
      <input id="purgedays" type="number" min="1" max="3650" value="30" style="width:84px" aria-label="Số ngày">
      <span class="chip">ngày</span>
      <button class="btn alt" id="purgepreview" type="button">Xem trước</button>
      <button class="btn bad" id="purgego" type="button" disabled>Dọn</button>
    </div>
    <p id="purgeinfo" class="meta" role="status" style="margin:0 0 8px"></p>
    <div id="filelist" style="overflow-y:auto;flex:1;min-height:0;padding-bottom:16px"></div>
  </section>
</div>
<dialog id="dlg" aria-labelledby="dlgtitle"></dialog>

<script>
'use strict';
const prefix = location.pathname.startsWith('/apps/ai-hub') ? '/apps/ai-hub' : '';
if (prefix) document.getElementById('tinker-return').href = '/#/dashboard';
const $ = (sel) => document.querySelector(sel);
const S = {agents: [], tasks: [], messages: [], lastId: 0, thread: null, tab: 'room', unseen: 0, authed: true, limits: {}, legacy: {rows: [], exists: false}, files: null};
const FILE_ID = /^[0-9a-f]{32}$/;
const IMAGE_MIMES = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];
const STATUS = {todo: 'Chờ làm', in_progress: 'Đang làm', in_review: 'Chờ review', blocked: 'Bị chặn', done: 'Xong', cancelled: 'Đã huỷ'};
const KIND = {task: 'Giao việc', handoff: 'Nộp review', review: 'Review', result: 'Báo cáo', ack: 'Đã nhận', notice: 'Thông báo'};
const PALETTE = ['#7c3aed', '#16815d', '#c2410c', '#0e7490', '#be185d', '#4d7c0f', '#a16207', '#4338ca'];
// nút hành động theo trạng thái: [trạng thái đích, nhãn, cần ghi chú?]
const ACTIONS = {
  todo: [['in_progress', 'Bắt đầu'], ['blocked', 'Bị chặn', 1], ['cancelled', 'Huỷ việc', 1]],
  in_progress: [['in_review', 'Nộp review'], ['done', 'Hoàn thành'], ['blocked', 'Bị chặn', 1], ['cancelled', 'Huỷ việc', 1]],
  in_review: [['done', 'Duyệt đạt'], ['in_progress', 'Trả về sửa', 1], ['blocked', 'Bị chặn', 1], ['cancelled', 'Huỷ việc', 1]],
  blocked: [['in_progress', 'Tiếp tục'], ['cancelled', 'Huỷ việc', 1]],
  done: [['in_progress', 'Mở lại']],
  cancelled: [['in_progress', 'Mở lại']],
};

function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.append(typeof kid === 'object' ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
const colorOf = (id) => {
  if (id === 'anh') return 'var(--accent)';
  let n = 0;
  for (const c of String(id)) n = (n * 31 + c.charCodeAt(0)) >>> 0;
  return PALETTE[n % PALETTE.length];
};
const fmt = new Intl.DateTimeFormat('vi-VN', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
const when = (iso) => iso ? fmt.format(new Date(iso)) : '—';
function ago(iso) {
  if (!iso) return 'chưa từng';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'vừa xong';
  if (s < 3600) return Math.floor(s / 60) + ' phút trước';
  if (s < 86400) return Math.floor(s / 3600) + ' giờ trước';
  return Math.floor(s / 86400) + ' ngày trước';
}
const rid = () => 'ui-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtSize = (n) => n < 1024 ? n + ' B' : n < 1048576 ? Math.round(n / 1024) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
const safeUrl = (u) => /^https?:\/\//i.test(u || '') ? u : null;

async function api(path, method = 'GET', body) {
  const response = await fetch(prefix + '/api/v1' + path, {
    method, credentials: 'same-origin',
    headers: {'Content-Type': 'application/json', 'X-Mailbox-Request': '1'},
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data;
  try { data = await response.json(); } catch { throw new Error('Phản hồi máy chủ không hợp lệ.'); }
  if (!response.ok || !data.ok) {
    if (response.status === 401) { S.authed = false; throw new Error('Phiên đã hết hạn. Anh về Tinker để đăng nhập lại nhé.'); }
    throw new Error(data.message || (typeof data.error === 'string' ? data.error : 'Không hoàn tất được yêu cầu.'));
  }
  return data;
}
const showErr = (e) => { $('#err').textContent = e ? (e.message || String(e)) : ''; };
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch { /* http không phải secure context */ }
  const t = h('textarea', {style: 'position:fixed;opacity:0'}); t.value = text; document.body.append(t); t.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch { ok = false; }
  t.remove(); return ok;
}

async function uploadFile(file) {
  const max = S.limits.max_upload_bytes;
  if (max && file.size > max) throw new Error('“' + file.name + '” nặng ' + fmtSize(file.size) + ', tối đa ' + fmtSize(max) + '.');
  const response = await fetch(prefix + '/api/v1/files?name=' + encodeURIComponent(file.name), {
    method: 'POST', credentials: 'same-origin', body: file,
    headers: {'Content-Type': 'application/octet-stream', 'X-Mailbox-Request': '1'},
  });
  let data;
  try { data = await response.json(); } catch { throw new Error('Phản hồi máy chủ không hợp lệ.'); }
  if (!response.ok || !data.ok) {
    if (response.status === 401) S.authed = false;
    throw new Error(data.message || 'Không tải lên được “' + file.name + '”.');
  }
  return data.file;
}
function attachWidget(onError) {
  const picked = [];
  const input = h('input', {type: 'file', multiple: true, 'aria-label': 'Chọn tệp đính kèm'});
  const list = h('span', {class: 'attach'});
  const button = h('button', {class: 'btn alt', type: 'button', text: '📎 Đính kèm', onclick: () => input.click()});
  const render = () => list.replaceChildren(...picked.map((f, i) => h('span', {class: 'chip'}, f.name + ' · ' + fmtSize(f.size),
    h('button', {type: 'button', 'aria-label': 'Bỏ ' + f.name, text: '✕', onclick: () => { picked.splice(i, 1); render(); }}))));
  input.addEventListener('change', async () => {
    const files = [...input.files];
    input.value = '';
    button.disabled = true; button.textContent = 'Đang tải lên…';
    for (const file of files) {
      if (picked.length >= 10) { onError(new Error('Tối đa 10 tệp mỗi lần.')); break; }
      try { picked.push(await uploadFile(file)); onError(null); } catch (e) { onError(e); }
      render();
    }
    button.disabled = false; button.textContent = '📎 Đính kèm';
  });
  return {el: h('span', {class: 'attach'}, button, input, list), ids: () => picked.map((f) => ({id: f.id})),
    busy: () => button.disabled, reset: () => { picked.length = 0; render(); }};
}

/* ----------------------------------------------------------------- Markdown an toàn
   Bộ con của Markdown, dựng bằng DOM (createElement/textContent), không dùng innerHTML nên HTML thô trong
   tin chỉ hiện như chữ. Liên kết chỉ nhận http(s) và tệp của hub; không hiển thị ảnh từ xa. */
const MD_LIST = /^(\s*)([-+*]|\d{1,9}[.)])\s+(.*)$/;
const MD_FENCE = /^\s{0,3}(`{3,}|~{3,})\s*[\w+#.-]*\s*$/;
const MD_HR = /^\s{0,3}([-*_])(?:\s*\1){2,}\s*$/;
const MD_HEADING = /^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/;
const MD_QUOTE = /^\s{0,3}>\s?(.*)$/;
const MD_TABLE_SEP = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
const MD_INLINE = /(`+)([\s\S]*?[^`])\1(?!`)|\[([^\]\n]+)\]\(([^)\s]+)\)|(https?:\/\/[^\s<>]*[^\s<>.,;:!?)\]'"])|\*\*(?=\S)([\s\S]*?\S)\*\*|__(?=\S)([\s\S]*?\S)__|~~(?=\S)([\s\S]*?\S)~~|\*(?=[^\s*])([\s\S]*?[^\s*])\*|_(?=[^\s_])([\s\S]*?[^\s_])_/g;

function mdHref(url) {
  if (/^https?:\/\/[^\s]+$/i.test(url)) return url;
  if (/^\/api\/v1\/files\/[0-9a-f]{32}$/.test(url)) return prefix + url;
  return null;
}
function mdInline(text, parent, inLink) {
  const re = new RegExp(MD_INLINE.source, 'g');
  const plain = (t) => { if (t) parent.append(document.createTextNode(t)); };
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    const at = m.index;
    if (m[7] !== undefined || m[10] !== undefined) {   // gạch dưới chỉ in nghiêng/đậm ở ranh giới từ: snake_case giữ nguyên
      const before = text[at - 1], after = text[at + m[0].length];
      if ((before && /\w/.test(before)) || (after && /\w/.test(after))) { re.lastIndex = at + 1; continue; }
    }
    if (m[3] !== undefined && (inLink || !mdHref(m[4]))) { re.lastIndex = at + 1; continue; }
    if (m[5] !== undefined && inLink) { re.lastIndex = at + m[0].length; continue; }

/* ---------------------------------------------------------------------- AI */
function renderAgentList() {
  $('#agentlist').replaceChildren(...(S.agents.length ? S.agents.map((a) =>
    h('div', {class: 'card agent', style: '--person:' + (a.online ? 'var(--ok)' : '#9aa5b8')},
      h('div', {class: 'top'}, h('span', {class: 'dot' + (a.online ? ' on' : '')}), h('strong', {text: a.name}), h('span', {class: 'chip', text: a.id}),
        h('span', {class: 'chip', text: a.mode === 'push' ? 'Hub gọi được' : 'Tự hỏi hub mỗi ' + Math.round(a.poll_interval / 60 * 10) / 10 + ' phút'}),
        a.enabled ? null : h('span', {class: 'chip', text: 'Đang tắt'})),
      h('div', {class: 'meta', text: (a.role || 'Chưa ghi vai trò') + ' · thấy lần cuối: ' + ago(a.last_seen)}),
      h('div', {class: 'row'},
        h('button', {class: 'btn alt', type: 'button', text: 'Đổi token', onclick: () => rotate(a)}),
        h('button', {class: 'btn alt', type: 'button', text: a.enabled ? 'Tắt' : 'Bật', onclick: () => toggle(a)})))) :
    [h('div', {class: 'empty'}, h('strong', {text: 'Chưa có AI nào'}), h('div', {text: 'Bấm “+ Thêm AI” để tạo token cho AI đầu tiên.'}))]));
}
async function toggle(a) {
  try { await api('/agents/' + a.id + '/' + (a.enabled ? 'disable' : 'enable'), 'POST', {}); await loadAgents(); showErr(null); } catch (e) { showErr(e); }
}
async function rotate(a) {
  if (!confirm('Đổi token của ' + a.name + '? Token cũ sẽ ngừng dùng được ngay.')) return;
  try { const d = await api('/agents/' + a.id + '/rotate', 'POST', {}); tokenDialog(a.id, d.token); showErr(null); } catch (e) { showErr(e); }
}
function tokenDialog(agentId, token) {
  const status = h('span', {class: 'warn', role: 'status'});
  dialog(h('h2', {id: 'dlgtitle', text: 'Token của ' + agentId}),
    h('div', {class: 'token', text: token}),
    h('p', {class: 'warn', text: 'Token chỉ hiện một lần. Lưu vào biến môi trường AI_HUB_TOKEN của AI đó; đừng dán vào tin nhắn hay báo cáo.'}),
    h('div', {class: 'toolbar'}, h('button', {class: 'btn', type: 'button', text: 'Sao chép', onclick: async () => { status.textContent = (await copyText(token)) ? 'Đã sao chép.' : 'Không sao chép được, hãy chọn và copy thủ công.'; }}), closeBtn('Xong'), status));
}
function newAgentDialog() {
  const err = h('p', {class: 'derr', role: 'alert'});
  const f = {
    id: h('input', {maxlength: 32, required: true, placeholder: 'vd: codex, claude, muse', pattern: '[a-z][a-z0-9_-]{1,31}', autocapitalize: 'none'}),
    name: h('input', {maxlength: 64, required: true, placeholder: 'Tên hiển thị'}),
    mode: h('select', {}, opt('push', 'push — hub chạy được AI (Codex, Claude Code…)'), opt('pull', 'pull — AI tự hỏi hub theo lịch (Muse…)')),
    role: h('input', {maxlength: 200, placeholder: 'Vai trò, vd: Làm code / Test và review'}),
    poll: h('input', {type: 'number', min: 5, max: 86400, value: 300}),
  };
  const submit = async (ev) => {
    ev.preventDefault();
    try {
      const d = await api('/agents', 'POST', {id: f.id.value.trim(), name: f.name.value.trim(), mode: f.mode.value, role: f.role.value.trim(), poll_interval: Number(f.poll.value)});
      await loadAgents(); tokenDialog(d.agent.id, d.token);
    } catch (e) { err.textContent = e.message; }
  };
  dialog(h('h2', {id: 'dlgtitle', text: 'Thêm AI vào phòng'}),
    h('form', {class: 'dlg', style: 'padding:0', onsubmit: submit},
      h('div', {class: 'two'}, h('label', {}, 'Mã (id)', f.id), h('label', {}, 'Tên', f.name)),
      h('label', {}, 'Cách kết nối', f.mode), h('label', {}, 'Vai trò', f.role),
      h('label', {}, 'Chu kỳ hỏi hub (giây, cho AI kiểu pull)', f.poll),
      err, h('div', {class: 'toolbar'}, h('button', {class: 'btn', type: 'submit', text: 'Tạo và lấy token'}), closeBtn('Huỷ'))));
}

/* --------------------------------------------------------------------- tệp */
async function loadFiles() {
  try { S.files = await api('/files?limit=200'); renderFiles(); showErr(null); } catch (e) { showErr(e); }
}
function renderFiles() {
  const d = S.files;
  if (!d) return;
  const pct = d.quota_bytes ? Math.min(100, Math.round(d.used_bytes * 100 / d.quota_bytes)) : 0;
  $('#fsummary').replaceChildren(h('strong', {text: fmtSize(d.used_bytes) + ' / ' + fmtSize(d.quota_bytes)}),
    h('span', {class: 'meta', text: '  ·  ' + d.files.length + ' tệp (' + pct + '%)'}),
    h('div', {class: 'bar', role: 'progressbar', 'aria-valuenow': pct, 'aria-valuemin': 0, 'aria-valuemax': 100}, h('span', {style: 'width:' + pct + '%'})));
  const files = d.files.filter((f) => FILE_ID.test(f.id));
  $('#filelist').replaceChildren(...(files.length ? files.map((f) => {
    const href = prefix + '/api/v1/files/' + f.id;
    return h('div', {class: 'card frow'},
      IMAGE_MIMES.includes(f.mime) ? h('img', {src: href, alt: '', loading: 'lazy'}) : h('span', {class: 'chip', text: f.mime === 'text/plain' ? 'văn bản' : 'tệp'}),
      h('div', {class: 'info'}, h('a', {href, target: '_blank', rel: 'noopener noreferrer', text: f.name}),
        h('div', {class: 'meta', text: fmtSize(f.size) + ' · ' + f.uploader + ' · ' + when(f.created_at)})),
      h('button', {class: 'btn alt', type: 'button', text: 'Xoá', 'aria-label': 'Xoá ' + f.name, onclick: () => deleteFile(f)}));
  }) : [h('div', {class: 'empty'}, h('strong', {text: 'Chưa có tệp nào'}), h('div', {text: 'Tệp đính kèm sẽ hiện ở đây.'}))]));
}
function markDeleted(ids) {
  const gone = new Set(ids);
  for (const m of [...S.messages, ...S.legacy.rows]) for (const f of m.files || []) if (gone.has(f.id)) f.deleted = true;
  renderFeed();
}
async function deleteFile(f) {
  if (!confirm('Xoá “' + f.name + '”? Các tin đã gắn tệp này sẽ chỉ còn tên, không mở được nữa.')) return;
  try { await api('/files/' + f.id + '/delete', 'POST', {}); markDeleted([f.id]); await loadFiles(); showErr(null); } catch (e) { showErr(e); }
}
async function purgeFiles(dry) {
  const days = parseInt($('#purgedays').value, 10), info = $('#purgeinfo');
  if (!(days >= 1 && days <= 3650)) { info.textContent = 'Số ngày phải từ 1 đến 3650.'; return; }
  try {
    const r = (await api('/files/purge', 'POST', {older_than_days: days, dry_run: dry})).result;
    info.textContent = dry ? (r.count ? 'Sẽ xoá ' + r.count + ' tệp, giải phóng ' + fmtSize(r.bytes) + '. Bấm “Dọn” để xoá thật.' : 'Không có tệp nào cũ hơn ' + days + ' ngày.')
      : 'Đã xoá ' + r.count + ' tệp (' + fmtSize(r.bytes) + ').';
    $('#purgego').disabled = !(dry && r.count);
    if (!dry) { S.messages = []; S.lastId = 0; await loadMessages(true); renderFeed(); await loadFiles(); }
  } catch (e) { info.textContent = e.message; }
}
function legacyImportDialog() {
  const out = h('div'), err = h('p', {class: 'derr', role: 'alert'});
  const tinker = h('input', {value: 'muse', maxlength: 32, autocapitalize: 'none', 'aria-label': 'Tên mới của tinker'});
  const emi = h('input', {placeholder: 'emi (giữ nguyên)', maxlength: 32, autocapitalize: 'none', 'aria-label': 'Tên mới của emi'});
  const run = async (dry) => {
    err.textContent = ''; out.replaceChildren();
    const map = {};
    if (tinker.value.trim()) map.tinker = tinker.value.trim();
    if (emi.value.trim()) map.emi = emi.value.trim();
    try {
      const st = (await api('/legacy/import', 'POST', {dry_run: dry, map})).stats;
      out.replaceChildren(...[h('p', {text: (dry ? 'Xem trước: ' : 'Đã nhập: ') + st.imported + ' tin mới · ' + st.already_imported + ' đã có từ trước · ' + st.invalid + ' hàng lỗi (tổng ' + st.total + ').'}),
        ...st.problems.map((p) => h('p', {class: 'meta', text: p})),
        dry ? null : h('p', {class: 'warn', text: 'Xem trong tab Phòng → “📜 Hộp thư cũ”.'})].filter(Boolean));
      if (!dry) await probeLegacy();
    } catch (e) { err.textContent = e.message; }
  };
  dialog(h('h2', {id: 'dlgtitle', text: 'Nhập lịch sử hộp thư cũ'}),
    h('p', {text: 'Đưa tin trong hộp thư cũ (Tinker, Emi) vào đây để xem lại. Chỉ để xem: các AI sẽ không nhận hay chạy lại việc cũ. Chạy lại nhiều lần không bị trùng.'}),
    h('div', {class: 'two'}, h('label', {}, 'tinker hiện là', tinker), h('label', {}, 'emi hiện là', emi)),
    out, err,
    h('div', {class: 'toolbar'}, h('button', {class: 'btn alt', type: 'button', text: 'Xem trước', onclick: () => run(true)}),
      h('button', {class: 'btn', type: 'button', text: 'Nhập', onclick: () => run(false)}), closeBtn()));
}

/* ------------------------------------------------------------------- khung */
function showTab(name) {
  S.tab = name;
  for (const b of document.querySelectorAll('[role=tab]')) b.setAttribute('aria-selected', String(b.dataset.tab === name));
  for (const v of document.querySelectorAll('.view')) v.classList.toggle('active', v.id === 'view-' + name);
  if (name === 'room') { S.unseen = 0; updateTitle(); const f = $('#feed'); f.scrollTop = f.scrollHeight; }
  if (name === 'files') loadFiles();
}
let beat = 0;
async function refreshMeta() { try { await Promise.all([loadAgents(), loadTasks()]); } catch (e) { showErr(e); } }
async function tick() {
  if (!S.authed) return;
  beat += 1;
  if (document.hidden && beat % 5) return;   // tab ẩn: hỏi thưa hơn (~20 giây)
  try { await loadMessages(false); showErr(null); } catch (e) { showErr(e); }
  if (beat % 3 === 0) refreshMeta();
}
async function init() {
  for (const b of document.querySelectorAll('[role=tab]')) b.addEventListener('click', () => showTab(b.dataset.tab));
  S.attach = attachWidget(showErr);
  $('#attachslot').replaceWith(S.attach.el);
  $('#composer').addEventListener('submit', sendMessage);
  $('#msg').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('#composer').requestSubmit(); });
  $('#newtask').addEventListener('click', newTaskDialog);
  $('#newagent').addEventListener('click', newAgentDialog);
  $('#importlegacy').addEventListener('click', legacyImportDialog);
  $('#legacybtn').addEventListener('click', openLegacy);
  $('#purgepreview').addEventListener('click', () => purgeFiles(true));
  $('#purgego').addEventListener('click', () => { if (confirm('Xoá thật các tệp cũ? Việc này không hoàn tác được.')) purgeFiles(false); });
  $('#purgedays').addEventListener('input', () => { $('#purgego').disabled = true; });
  $('#fassignee').addEventListener('change', renderBoard);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { S.unseen = 0; updateTitle(); tick(); } });
  try {
    S.limits = (await api('/me')).limits || {};
    await Promise.all([loadAgents(), loadTasks(), loadMessages(true), probeLegacy()]);
    renderFeed(); renderBoard();
    $('#feed').scrollTop = $('#feed').scrollHeight;
  } catch (e) { showErr(e); renderFeed(); }
  setInterval(tick, 4000);
}
init();
</script>
</body>
</html>
